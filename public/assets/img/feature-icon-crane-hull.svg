<svg width="60" height="60" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Gantry crane lowering a hull block onto a ship under construction -->
  <g fill="#7c1d1f">
    <!-- crane top beam and legs -->
    <rect x="6" y="4" width="52" height="4" rx="1"/>
    <rect x="6" y="4" width="4" height="36" rx="1"/>
    <rect x="54" y="4" width="4" height="36" rx="1"/>
    <!-- trolley and cable -->
    <rect x="27" y="8" width="10" height="4" rx="1"/>
    <rect x="31.2" y="12" width="1.6" height="6"/>
    <!-- spreader bar -->
    <rect x="25" y="18" width="14" height="2.6" rx="1.3"/>
    <!-- slings to the block -->
    <path d="M 26.2 20 L 24 25 L 26.5 25 L 28.2 20 Z"/>
    <path d="M 37.8 20 L 40 25 L 37.5 25 L 35.8 20 Z"/>
    <!-- hull block being lifted -->
    <rect x="21" y="25" width="22" height="9" rx="1"/>
    <!-- ship hull below -->
    <path d="M 12 42 L 52 42 L 47.5 54 Q 32 57 16.5 54 Z"/>
    <!-- keel blocks -->
    <rect x="20" y="55" width="4" height="5"/>
    <rect x="30" y="56.5" width="4" height="3.5"/>
    <rect x="40" y="55" width="4" height="5"/>
    <!-- ground -->
    <rect x="4" y="60" width="56" height="2.4" rx="1"/>
  </g>
</svg>
